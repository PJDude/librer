app-id: io.github.pjdude.Librer
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: librer

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  - --device=all

  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=home

  - --persist=.librer

modules:
  - name: python3-numpy
    buildsystem: simple
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/ed/a7/2bcd3fdbb87804755c35b729bf8709d62025c5f4cfd7d5b2415997097515/numpy-2.5.1-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: 9726558e8db4a5bf7929a70ae50f63abda4daf0efe810e3bfbab95976f75fc1a
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} numpy==2.5.1

  - name: python3-pillow
    buildsystem: simple
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/f7/62/de5bdd77d935331f4f802edc11e4d82950f642caad6cb2f949837b8560e2/pillow-12.3.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: 0847a763afefb695bc912d7c131e7e0632d4edc1d8698f58ddabec8e46b8b6d3
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} pillow==12.3.0

  - name: python3-dearpygui
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "dearpygui==2.3.1" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/cc/e0/df598671f40a7fffb8390946115d9e9cf12d3f4a52f5b9381bddc5699aee/dearpygui-2.3.1-cp313-cp313-manylinux1_x86_64.whl
        sha256: e3f64c8d4cae68a3b5be1b7531d08400ccbf1e4ff03c7acfc85954f98993f864
        only-arches:
          - x86_64

  - name: python3-psutil
    buildsystem: simple
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/b5/70/5d8df3b09e25bce090399cf48e452d25c935ab72dad19406c77f4e828045/psutil-7.2.2-cp36-abi3-manylinux2010_x86_64.manylinux_2_12_x86_64.manylinux_2_28_x86_64.whl
        sha256: 076a2d2f923fd4821644f5ba89f059523da90dc9014e85f8e45a5774ca5bc6f9
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} numpy==2.5.1

  - name: librer
    buildsystem: simple
    build-commands:
      - echo stage_00
      - mkdir -p /app/share/librer
      - echo stage_01
      - install -Dm755 librer.sh /app/bin/librer
      - echo stage_02
      - cp -v src/librer.py /app/share/librer/librer.py
      - echo stage_03
      - cp -v src/version.txt /app/share/librer/version.txt
      - echo stage_04
      - echo "Flatpak Build" > /app/share/librer/distro.info.txt
      - echo stage_05
      - cp -v src/librer_images.py /app/share/librer/librer_images.py
      - echo stage_06
      - install -Dm644 src/icons/librer.png                     /app/share/icons/hicolor/256x256/apps/io.github.pjdude.Librer.png
      - echo stage_07
      - install -Dm644 io.github.pjdude.Librer.desktop          /app/share/applications/io.github.pjdude.Librer.desktop
      - echo stage_08
      - install -Dm644 io.github.pjdude.Librer.metainfo.xml     /app/share/metainfo/io.github.pjdude.Librer.metainfo.xml
      - echo stage_09

    sources:
       - type: file
         path: librer.sh
       - type: file
         path: io.github.pjdude.Librer.desktop
       - type: file
         path: io.github.pjdude.Librer.metainfo.xml
       - type: file
         path: src/librer_images.py
         dest: src
       - type: file
         path: src/librer.py
         dest: src
       - type: file
         path: src/version.txt
         dest: src
       - type: file
         path: src/icons/librer.png
         dest: src/icons
