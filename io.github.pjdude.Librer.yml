app-id: io.github.pjdude.Librer
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

command: librer

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=x11
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --filesystem=host
  - --persist=.librer

modules:
  - name: 7zip
    buildsystem: simple
    build-commands:
      - install -Dm755 7zzs /app/bin/7z
    sources:
      - type: archive
        url: https://github.com/ip7z/7zip/releases/download/26.01/7z2601-linux-x64.tar.xz
        sha256: 8ea0fc8a135e7b848e80a4116fe22dff56c8c4518dde1f43cce67f4e340b437a
        only-arches: [x86_64]

  - name: librer_py
    buildsystem: simple

    sources:
      - type: dir
        path: build-pyinstaller/librer

    build-commands:
      - mkdir -p /app/share/librer
      - cp -a -v . /app/share/librer/

  - name: librer
    buildsystem: simple

    sources:
       - type: file
         path: librer.sh
       - type: file
         path: io.github.pjdude.Librer.desktop
       - type: file
         path: io.github.pjdude.Librer.metainfo.xml
       - type: file
         path: src/icons/librer.png
         dest: src/icons

    build-commands:
      - mkdir -p /app/share/librer
      - install -Dm755 librer.sh /app/bin/librer
      - install -Dm644 src/icons/librer.png                     /app/share/icons/hicolor/256x256/apps/io.github.pjdude.Librer.png
      - install -Dm644 io.github.pjdude.Librer.desktop          /app/share/applications/io.github.pjdude.Librer.desktop
      - install -Dm644 io.github.pjdude.Librer.metainfo.xml     /app/share/metainfo/io.github.pjdude.Librer.metainfo.xml
